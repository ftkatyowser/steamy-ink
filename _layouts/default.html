<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta name="robots" content="noai, noimageai">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" type="image/png" sizes="64x64" href="{{ '/assets/images/favicon-64.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <!-- Mobile menu toggle button -->
  <button class="menu-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">
    <span class="menu-toggle-icon"></span>
  </button>

  <!-- Overlay for mobile menu -->
  <div class="menu-overlay"></div>

  <div class="page-wrapper">

    {% include masthead.html %}

    {% include headline-banner.html %}
    {% include notice-banner.html %}
    
    <div class="main-layout">
      
      {% include sidebar.html %}
      
      <main id="main" class="main-content">
        {{ content }}
      </main>
      
    </div>
    
    {% include footer.html %}

  </div>

  <script src="{{ '/assets/js/menu.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/dateline.js' | relative_url }}"></script>
</body>
</html>
